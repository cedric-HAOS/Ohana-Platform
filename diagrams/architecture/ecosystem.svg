<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Écosystème Ohana</title>
  <desc id="desc">Huit dépôts : Platform compose, Installer déploie, Agent autorise et exécute, Vision projette, Katsuyu traite, Shizune présente les décisions, House documente et les add-ons collectent.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#28d7c0"/></marker>
    <style>
      .title{font:700 40px Segoe UI,Arial,sans-serif;fill:#f1f7f7}
      .subtitle{font:400 20px Segoe UI,Arial,sans-serif;fill:#a9b9bc}
      .name{font:650 23px Segoe UI,Arial,sans-serif;fill:#f1f7f7}
      .detail{font:400 18px Segoe UI,Arial,sans-serif;fill:#a9b9bc}
      .box{fill:#0d1a20;stroke:#294149;stroke-width:2;rx:18}
      .owner{fill:#0d1a20;stroke:#28d7c0;stroke-width:3;rx:18}
      .flow{fill:none;stroke:#28d7c0;stroke-width:3;marker-end:url(#arrow)}
      .policy{fill:none;stroke:#718489;stroke-width:2;stroke-dasharray:7 7}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#071014"/>
  <text x="60" y="70" class="title">Écosystème Ohana</text>
  <text x="60" y="110" class="subtitle">Contrats, exécution, observation et interfaces — rôles des huit dépôts</text>

  <rect x="60" y="160" width="440" height="145" class="box"/>
  <text x="85" y="205" class="name">Ohana-Platform</text>
  <text x="85" y="244" class="detail">Architecture, contrats et design</text>
  <text x="85" y="275" class="detail">Catalogue et composition des releases</text>

  <rect x="580" y="160" width="440" height="145" class="box"/>
  <text x="605" y="205" class="name">Ohana-Installer</text>
  <text x="605" y="244" class="detail">Installe, met à jour et restaure</text>
  <text x="605" y="275" class="detail">Linux/systemd et configurations</text>

  <rect x="1100" y="160" width="440" height="145" class="box"/>
  <text x="1125" y="205" class="name">Ohana-House</text>
  <text x="1125" y="244" class="detail">Déploiement de référence Konoha</text>
  <text x="1125" y="275" class="detail">Procédures, preuves et inventaire</text>

  <rect x="60" y="420" width="440" height="175" class="box"/>
  <text x="85" y="465" class="name">Ohana-hassio-addons</text>
  <text x="85" y="504" class="detail">teleinfo2mqtt sur LINKY-01</text>
  <text x="85" y="535" class="detail">MQTT vers HA-01 ; HTTP vers Agent</text>
  <text x="85" y="566" class="detail">Sorties indépendantes</text>

  <rect x="580" y="420" width="440" height="175" class="owner"/>
  <text x="605" y="465" class="name">Ohana-Agent</text>
  <text x="605" y="504" class="detail">Shikamaru observe et vérifie</text>
  <text x="605" y="535" class="detail">Tsunade coordonne et propose</text>
  <text x="605" y="566" class="detail">Agent valide, autorise et exécute</text>

  <rect x="1100" y="420" width="440" height="175" class="box"/>
  <text x="1125" y="465" class="name">Ohana-Vision</text>
  <text x="1125" y="504" class="detail">Cockpit, santé, historique, topologie</text>
  <text x="1125" y="535" class="detail">Administration transmise à Agent</text>
  <text x="1125" y="566" class="detail">Passerelle compagnon bornée</text>

  <rect x="580" y="735" width="440" height="160" class="box"/>
  <text x="605" y="780" class="name">Ohana-Katsuyu</text>
  <text x="605" y="819" class="detail">Worker Windows, jobs HTTPS autorisés</text>
  <text x="605" y="850" class="detail">Traitements lourds et IA facultative</text>
  <text x="605" y="881" class="detail">Résultats remis à Agent</text>

  <rect x="1100" y="735" width="440" height="160" class="box"/>
  <text x="1125" y="780" class="name">Ohana-Shizune</text>
  <text x="1125" y="819" class="detail">PWA : synthèse et décisions</text>
  <text x="1125" y="850" class="detail">Réponses structurées via Vision</text>
  <text x="1125" y="881" class="detail">Agent garde le contrôle des actions</text>

  <path d="M500 233 H580" class="flow"/>
  <path d="M800 305 V420" class="flow"/>
  <path d="M1020 270 H1060 V365 H1320 V420" class="flow"/>
  <path d="M280 305 V360 H1320 V305" class="policy"/>
  <path d="M500 507 H580" class="flow"/>
  <path d="M1020 490 H1100" class="flow"/>
  <path d="M1100 545 H1020" class="flow"/>
  <path d="M750 595 V735" class="flow"/>
  <path d="M850 735 V595" class="flow"/>
  <path d="M1265 595 V735" class="flow"/>
  <path d="M1375 735 V595" class="flow"/>
  <text x="70" y="945" class="detail">Flèches : échanges ; pointillés : référence documentaire. Aucune interface ne contourne l'autorisation Agent.</text>
  <text x="70" y="979" class="detail">Ohana-Platform · Référence documentaire consolidée le 10 octobre 2026</text>
</svg>
